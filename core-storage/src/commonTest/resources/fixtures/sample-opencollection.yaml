opencollection: "1.0.0"
info:
  name: "Sample OpenCollection"
  version: "1.0.0"
bundled: true
config:
  environments:
    - name: "Production"
      variables:
        - name: "baseUrl"
          value: "https://api.example.com"
items:
  - info:
      name: "Users"
      type: "folder"
    items:
      - info:
          name: "List Users"
          type: "http"
        http:
          method: "GET"
          url: "{{baseUrl}}/users"
          headers:
            - name: "Accept"
              value: "application/json"
