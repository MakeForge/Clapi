services:
  vault:
    image: hashicorp/vault:latest
    container_name: local-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "root-dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  vault-init:
    image: hashicorp/vault:latest
    container_name: local-vault-seeder
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root-dev-token"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Seeding KV v2 secret into Vault..."
        vault kv put secret/payment/foo client_id="foo_client_123" client_secret="sk_live_secret_456"
        echo "Secret seeded successfully!"
        tail -f /dev/null