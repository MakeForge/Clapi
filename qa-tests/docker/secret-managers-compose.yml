services:
  vault:
    image: hashicorp/vault:latest
    container_name: local-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "root-dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  vault-init:
    image: hashicorp/vault:latest
    container_name: local-vault-seeder
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root-dev-token"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Seeding KV v2 secret into Vault..."
        vault kv put secret/payment/foo client_id="foo_client_123" client_secret="sk_live_secret_456"
        echo "Secret seeded successfully!"
        tail -f /dev/null

  localstack:
    image: localstack/localstack:3.8.0
    container_name: local-aws
    ports:
      - "4566:4566"
    environment:
      SERVICES: "secretsmanager"
      AWS_DEFAULT_REGION: "us-east-1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s

  localstack-seeder:
    image: amazon/aws-cli:latest
    container_name: local-aws-seeder
    restart: "no"
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "us-east-1"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for LocalStack Secrets Manager..."
        aws --endpoint-url=http://localstack:4566 secretsmanager create-secret \
          --name "local/payment/foo" \
          --secret-string '{"client_id":"foo_client_123","client_secret":"sk_live_secret_456"}'
        echo "LocalStack secret seeded successfully!"
        tail -f /dev/null

  azure-keyvault:
    image: nagyesta/lowkey-vault:7.4.0-ubi10-minimal
    container_name: local-azure-vault
    ports:
      - "8443:8443"
    environment:
      LOWKEY_ARGS: "--server.port=8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:8443/ping || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s

  azure-vault-seeder:
    image: curlimages/curl:latest
    container_name: local-azure-seeder
    restart: "no"
    depends_on:
      azure-keyvault:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Creating vault in Lowkey Vault..."
        curl -k -f -s -X POST "https://azure-keyvault:8443/management/vault" \
          -H "Content-Type: application/json" \
          -d '{"baseUri": "https://localhost:8443", "recoveryLevel": "Purgeable"}'

        echo "Seeding JSON secret..."
        curl -k -f -s -X PUT "https://azure-keyvault:8443/secrets/payment-foo?api-version=7.4" \
          -H "Host: localhost:8443" \
          -H "Authorization: Bearer dummy-token" \
          -H "Content-Type: application/json" \
          -d '{"value": "{\"client_id\":\"azure_client_999\",\"client_secret\":\"sk_azure_secret_888\"}", "contentType": "application/json"}'

        echo "Seeding Plaintext secret..."
        curl -k -f -s -X PUT "https://azure-keyvault:8443/secrets/plain-token?api-version=7.4" \
          -H "Host: localhost:8443" \
          -H "Authorization: Bearer dummy-token" \
          -H "Content-Type: application/json" \
          -d '{"value": "super-secret-plain-token-12345", "contentType": "text/plain"}'

        echo "Azure secrets seeded successfully!"
        tail -f /dev/null

  gcp-secretmanager:
    image: ghcr.io/blackwell-systems/gcp-secret-manager-emulator-rest:1.9
    container_name: local-gcp-secretmanager
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/projects || exit 0"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  gcp-seeder:
    image: curlimages/curl:latest
    container_name: local-gcp-seeder
    restart: "no"
    depends_on:
      gcp-secretmanager:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Creating secret: payment-foo..."
        curl -f -s -X POST "http://gcp-secretmanager:8080/v1/projects/my-test-project/secrets?secretId=payment-foo" \
          -H "Content-Type: application/json" \
          -d '{"replication": {"automatic": {}}}'

        echo "Adding JSON version to payment-foo..."
        curl -f -s -X POST "http://gcp-secretmanager:8080/v1/projects/my-test-project/secrets/payment-foo:addVersion" \
          -H "Content-Type: application/json" \
          -d '{"payload": {"data": "eyJjbGllbnRfaWQiOiJnY3BfY2xpZW50Xzc4OSIsImNsaWVudF9zZWNyZXQiOiJza19nY3Bfc2VjcmV0Xzk5OSJ9"}}'

        echo "Creating secret: plain-token..."
        curl -f -s -X POST "http://gcp-secretmanager:8080/v1/projects/my-test-project/secrets?secretId=plain-token" \
          -H "Content-Type: application/json" \
          -d '{"replication": {"automatic": {}}}'

        echo "Adding plaintext version to plain-token..."
        curl -f -s -X POST "http://gcp-secretmanager:8080/v1/projects/my-test-project/secrets/plain-token:addVersion" \
          -H "Content-Type: application/json" \
          -d '{"payload": {"data": "Z2NwLXBsYWluLXRva2VuLXZhbHVlLTEyMzQ1"}}'

        echo "GCP secrets seeded successfully!"
        tail -f /dev/null
