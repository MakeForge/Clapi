name: Bug Report
description: Create a report to help us improve
labels: ["bug"]
projects: []
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clapi Version
      description: What version of Clapi are you running?
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating System
      description: What Operating System are you using?
  - type: textarea
    id: logs
    attributes:
      label: (Optional) Relevant log output
      description: Please copy and paste any relevant log output, preferably from the Crash Dialog.
      render: shell
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!