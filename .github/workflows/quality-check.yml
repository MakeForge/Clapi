# Modified by MakeForge (2026)
name: Quality Check

# ─── Triggers ──────────────────────────────────────────────────────────────────
# • every push to main (or a PR targeting main)
# • manual trigger
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit, UI & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start Docker Compose test services
        run: ./gradlew :qa-tests:dockerComposeUp --no-daemon --stacktrace

      - name: Run full 10-module test suite
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            ./gradlew \
            :core-model:allTests \
            :core-network:desktopTest \
            :core-scripting:desktopTest \
            :core-storage:allTests \
            :editor-core:desktopTest \
            :editor-ui:allTests \
            :mcp-server:allTests \
            :ui-shared:desktopTest \
            :ui-desktop:desktopTest \
            :qa-tests:jvmTest \
            --no-parallel \
            --no-daemon \
            --stacktrace \
            --continue

      - name: Verify Roborazzi visual baselines
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            ./gradlew :ui-desktop:verifyRoborazziDesktop --no-daemon --stacktrace

      - name: Stop Docker Compose test services
        if: always()
        run: ./gradlew :qa-tests:dockerComposeDown --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            ui-desktop/build/outputs/roborazzi/
          retention-days: 7
